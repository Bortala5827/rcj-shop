<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shop 客服管理 · RCJ</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; background:#f5f7fa; color:#1f2937; }
  header { background:#111827; color:#fff; padding:14px 20px; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  .wrap { max-width:960px; margin:20px auto; padding:0 16px; }
  .login { max-width:360px; margin:80px auto; background:#fff; padding:24px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .login input { width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; }
  .login button { width:100%; margin-top:12px; padding:10px; background:#111827; color:#fff; border:0; border-radius:8px; cursor:pointer; font-size:14px; }
  .cols { display:grid; grid-template-columns:300px 1fr; gap:16px; }
  .card { background:#fff; border-radius:12px; box-shadow:0 1px 6px rgba(0,0,0,.06); padding:12px; }
  .thread { padding:10px 12px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .thread:hover { background:#f3f4f6; }
  .thread.active { background:#eef2ff; border-color:#c7d2fe; }
  .thread .name { font-weight:600; font-size:14px; }
  .thread .last { color:#6b7280; font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .msg { padding:8px 12px; border-radius:10px; margin:6px 0; max-width:80%; }
  .msg.visitor { background:#e5e7eb; margin-right:auto; }
  .msg.admin { background:#111827; color:#fff; margin-left:auto; }
  .chat { display:flex; flex-direction:column; }
  .chat .body { flex:1; overflow-y:auto; max-height:54vh; padding:8px; }
  textarea { width:100%; height:64px; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; resize:vertical; }
  .send { margin-top:8px; padding:9px 16px; background:#111827; color:#fff; border:0; border-radius:8px; cursor:pointer; }
  .empty { color:#9ca3af; text-align:center; padding:40px 0; }
  .badge { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; background:#fde68a; color:#92400e; }
</style>
</head>
<body>
<header><h1>🛒 Shop 客服管理</h1><span id="who" style="margin-left:auto;font-size:12px;opacity:.7"></span></header>

<div id="login" class="login">
  <h2 style="margin:0 0 14px;font-size:15px">输入管理密钥</h2>
  <input id="key" type="password" placeholder="ADMIN_KEY" />
  <button id="go">进入</button>
  <p style="font-size:12px;color:#9ca3af;margin-top:12px">密钥即 rcj-shop 的 <code>ADMIN_KEY</code> 环境变量。</p>
</div>

<div id="app" class="wrap" style="display:none">
  <div class="cols">
    <div class="card" id="list"></div>
    <div class="card chat">
      <div class="body" id="body"><div class="empty">← 选择一个会话</div></div>
      <textarea id="reply" placeholder="输入回复…"></textarea>
      <button class="send" id="send">发送回复</button>
    </div>
  </div>
</div>

<script>
const KEY = localStorage.getItem('rcj_shop_admin_key') || '';
const $ = s => document.querySelector(s);
let current = null;

if (KEY) enter(KEY);
$('#go').onclick = () => { const k = $('#key').value.trim(); if (k) enter(k); };

function enter(k){
  localStorage.setItem('rcj_shop_admin_key', k);
  $('#who').textContent = '已登录';
  $('#login').style.display = 'none';
  $('#app').style.display = 'block';
  loadThreads();
}
const api = p => fetch('/api/support/admin' + (p ? '?admin=' + encodeURIComponent(KEY) + (p.threadId ? '&threadId=' + encodeURIComponent(p.threadId) : '') : '?admin=' + encodeURIComponent(KEY)), {
  method: p && p.method ? p.method : 'GET',
  headers: { 'Content-Type': 'application/json' },
  body: p && p.body ? JSON.stringify(p.body) : undefined,
});

async function loadThreads(){
  const r = await api(); const d = await r.json();
  const list = $('#list'); list.innerHTML = '';
  if (!d.threads || !d.threads.length) { list.innerHTML = '<div class="empty">暂无会话</div>'; return; }
  d.threads.forEach(t => {
    const el = document.createElement('div');
    el.className = 'thread' + (current === t.id ? ' active' : '');
    el.innerHTML = `<div class="name">${esc(t.name || '访客')} ${t.status==='open'?'<span class="badge">未结</span>':''}</div>
      <div class="last">${esc((t.last||'').slice(0,40))} · ${t.msgCount} 条</div>`;
    el.onclick = () => { current = t.id; loadThreads(); loadThread(t.id); };
    list.appendChild(el);
  });
}
async function loadThread(id){
  const r = await api({ threadId: id }); const d = await r.json();
  const body = $('#body'); body.innerHTML = '';
  (d.messages||[]).forEach(m => {
    const el = document.createElement('div');
    el.className = 'msg ' + (m.role === 'admin' ? 'admin' : 'visitor');
    el.textContent = m.content;
    body.appendChild(el);
  });
  body.scrollTop = body.scrollHeight;
}
$('#send').onclick = async () => {
  const txt = $('#reply').value.trim(); if (!txt || !current) return;
  await api({ method:'POST', body: { threadId: current, content: txt } });
  $('#reply').value = ''; loadThread(current); loadThreads();
};
function esc(s){ return String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
</script>
</body>
</html>
